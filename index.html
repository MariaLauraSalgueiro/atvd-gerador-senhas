<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senhas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Gerador de Senhas</h1>

     
        <div class="grupo-resultado">
            <input type="text" id="campo-senha" readonly placeholder="Sua senha aparecerá aqui">
            <button type="button" id="btn-mostrar" title="Mostrar ou Ocultar Senha">👁️</button>
            <button type="button" id="btn-copiar" title="Copiar Senha">Copiar</button>
        </div>

        <div class="grupo-tamanho">
            <label for="campo-tamanho">Tamanho da senha (1 a 50):</label>
            <input type="number" id="campo-tamanho" min="1" max="50" value="12">
        </div>

   
        <div class="grupo-opcoes">
            <div class="opcao">
                <input type="checkbox" id="check-maiusculas" checked>
                <label for="check-maiusculas">Incluir letras maiúsculas (A-Z)</label>
            </div>

            <div class="opcao">
                <input type="checkbox" id="check-minusculas" checked>
                <label for="check-minusculas">Incluir letras minúsculas (a-z)</label>
            </div>

            <div class="opcao">
                <input type="checkbox" id="check-numeros" checked>
                <label for="check-numeros">Incluir números (0-9)</label>
            </div>

            <div class="opcao">
                <input type="checkbox" id="check-especiais">
                <label for="check-especiais">Incluir caracteres especiais (!@#$%...)</label>
            </div>
        </div>

        <div class="grupo-botoes">
            <button type="button" id="btn-gerar" class="btn-primario">Gerar Senha</button>
            <button type="button" id="btn-limpar" class="btn-secundario">Limpar</button>
        </div>

        
        <div id="mensagem" class="mensagem"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
